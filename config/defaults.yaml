# Electrode pad shape and motion tuning. Printer geometry is config/machine.yaml.

electrode:
  area_cm2: 0.5   # pad area; diameter is the circle of this area, in mm
  nlines: 10      # zigzag rows across the disk

layout:
  scale: 0.8        # initial 10–20 size; 1.0 is the measured nasion–inion arc
  scale_min: 0.5    # slider lower end
  scale_max: 1.5    # slider upper end

mesh:
  scale_to_mm: 1000              # multiply the PLY into millimetres (1000 if the scan is metres)
  poisson_depth: 12              # octree depth; higher keeps more surface detail
  poisson_density_quantile: 0.02 # drop this lowest fraction of Poisson vertices
  outlier_neighbors: 40
  outlier_std_ratio: 1.0
  island_min_size_ratio: 0.02    # keep components at least this fraction of the largest
  island_min_cells: 200
  icp_samples: 50000
  icp_max_correspondence_mm: 15
  icp_max_iteration: 80
  icp_fitness_min: 0.3
  icp_mean_dist_max_mm: 3

postprocess:
  arm_inside_margin_mm: 0.0
  engage_b_threshold_deg: 90
  engage_xy_offset_default_mm: 20
  engage_xy_offset_max_mm: 40
  engage_xy_offset_step_mm: 1
  engage_descent_min_clearance_mm: 20
  optimize_trace_order: true
  trace_order_method: c_nearest_neighbor
  trace_order_start: first
  skip_origin_when_bc_close: true
  c_short_transfer_max_delta_deg: 20
  c_order_xy_weight: 0.05
  axis_max_c_step_deg: 90
  normal_path_smooth_alpha: 0.5
  normal_path_smooth_passes: 1
  c_pole_nxy_min: 0.2
  c_max_slew_deg: 12
  c_crown_hold_b_deg: 20
  c_crown_step_deg: 1
  c_aim_deg: 5
  c_plan_sample_mm: 3
