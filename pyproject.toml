[project]
name = "layout-design"
version = "0.1.0"
description = "Place 10-20 electrodes on a head scan and write electrode G-code"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "open3d>=0.19.0",
    "pyvista>=0.48.4",
    "vtk>=9.6.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
layout = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real-mesh export (minutes); excluded from default CI",
]
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
